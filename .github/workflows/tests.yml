name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run the suite
        # bd-dependent tests self-skip via pytest.mark.skipif; the bd CLI is
        # deliberately not installed here.
        run: uv run --python ${{ matrix.python-version }} --extra dev pytest -q

  lint:
    # Advisory until the existing violations are cleared. Flip to blocking by
    # deleting continue-on-error once `ruff check scripts tests` is clean.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: ruff
        run: uvx ruff check scripts tests
